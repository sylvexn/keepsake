[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:gunicorn]
command=gunicorn --bind 127.0.0.1:5005 --workers 2 --timeout 120 app:app
directory=/app/backend
environment=KEEPSAKE_HOST="127.0.0.1",KEEPSAKE_PORT="5005",KEEPSAKE_UPLOAD_DIR="/data/uploads",KEEPSAKE_DB_PATH="/data/keepsake.db"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
