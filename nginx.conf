server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    # API and upload routes -> gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5005;
    }

    # Uploaded files - short hash filenames with image/video extensions
    location ~ ^/[a-f0-9]+\.(png|jpg|jpeg|gif|bmp|webp|mp4|webm|mov|avi|mkv)$ {
        root /data/uploads;
        try_files $uri =404;
    }

    # SPA frontend - everything else
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
